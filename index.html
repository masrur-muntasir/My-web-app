<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC Portal - Masrur</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-deep: #050510;
            --accent-cyan: #00f3ff;
            --accent-pink: #bc13fe;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-deep);
            color: white;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Login Section */
        #auth-container {
            position: absolute;
            z-index: 1000;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050510;
        }

        .auth-box {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--accent-cyan);
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        input {
            width: 100%; padding: 10px; margin: 10px 0;
            background: #111; border: 1px solid #444; color: white; border-radius: 5px;
        }

        .btn-main {
            width: 100%; padding: 10px; background: var(--accent-cyan);
            border: none; font-weight: bold; cursor: pointer; margin-top: 10px; border-radius: 5px;
        }

        .link { margin-top: 15px; font-size: 14px; cursor: pointer; color: #aaa; }
        .link span { color: var(--accent-cyan); text-decoration: underline; }

        .hidden { display: none !important; }

        /* 3D App Section */
        .stage {
            width: 90%; max-width: 1200px; height: 80vh;
            display: flex; align-items: center; justify-content: center;
            perspective: 2000px; gap: 40px; padding-bottom: 60px;
        }

        /* Book */
        .book-wrapper {
            position: relative; width: 300px; height: 450px;
            transform-style: preserve-3d; transition: 1s; z-index: 10;
        }
        .stage.active .book-wrapper { transform: translateX(-150px) rotateY(-10deg) scale(0.8); }

        .book { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; transition: 1s; cursor: pointer; }
        .book.open { transform: rotateY(-160deg); }

        .front {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid var(--accent-cyan);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px 20px 20px 10px; backface-visibility: hidden; z-index: 2;
        }

        .pages {
            position: absolute; width: 100%; height: 100%;
            background: #111; border: 1px solid #333;
            transform: rotateY(180deg); z-index: 1;
            display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 20px;
            border-radius: 10px 20px 20px 10px;
        }

        .subject-btn {
            padding: 12px; background: #222; border: 1px solid #444;
            color: #ddd; cursor: pointer; text-align: left; border-radius: 5px;
        }
        .subject-btn:hover { border-color: var(--accent-cyan); background: #2a2a2a; color: white; }

        /* Dashboard */
        .dashboard-wrapper {
            flex: 1; height: 100%; opacity: 0; pointer-events: none;
            transform: translateX(100px); transition: 0.5s;
        }
        .stage.active .dashboard-wrapper { opacity: 1; pointer-events: all; transform: translateX(0); }

        .glass-panel {
            background: rgba(0,0,0,0.7); border: 1px solid #333; border-radius: 15px;
            padding: 20px; height: 100%; display: flex; flex-direction: column;
        }

        /* Footer */
        .footer {
            position: fixed; bottom: 0; width: 100%; text-align: center;
            padding: 10px; background: #000; color: #666; font-size: 12px; border-top: 1px solid #333;
        }
        .highlight { color: var(--accent-cyan); }

        /* Mobile Fix */
        @media (max-width: 768px) {
            .stage { flex-direction: column; overflow-y: auto; height: 100vh; padding-top: 20px; }
            .stage.active .book-wrapper { transform: translateY(-100px) scale(0.6); }
            .dashboard-wrapper { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="auth-container">
        <div id="login-form" class="auth-box">
            <h2 style="color:var(--accent-cyan)">LOGIN</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button class="btn-main" onclick="handleLogin()">ENTER</button>
            <div class="link">No ID? <span onclick="toggleForms()">Register</span></div>
        </div>

        <div id="signup-form" class="auth-box hidden">
            <h2 style="color:var(--accent-pink)">REGISTER</h2>
            <input type="text" id="signup-name" placeholder="Name">
            <input type="email" id="signup-email" placeholder="Email">
            <input type="password" id="signup-password" placeholder="Password">
            <button class="btn-main" onclick="handleSignup()">CREATE ID</button>
            <div class="link">Has ID? <span onclick="toggleForms()">Login</span></div>
        </div>
    </div>

    <div id="stage" class="stage hidden">
        <div class="book-wrapper">
            <div class="book" id="book" onclick="toggleBook(this)">
                <div class="front">
                    <h1>SSC 2026</h1>
                    <p style="color:#aaa; letter-spacing:3px;">TRACKER</p>
                    <small id="user-name" style="color:var(--accent-pink); margin-top:10px;"></small>
                    <p style="margin-top:20px; font-size:10px; color:cyan;">TAP TO OPEN</p>
                </div>
                <div class="pages">
                    <div class="subject-btn" onclick="openSubject('physics')">⚛️ Physics</div>
                    <div class="subject-btn" onclick="openSubject('chemistry')">🧪 Chemistry</div>
                    <div class="subject-btn" onclick="openSubject('biology')">🧬 Biology</div>
                    <div class="subject-btn" onclick="openSubject('higherMath')">📐 Higher Math</div>
                    <button onclick="logout()" style="margin-top:20px; background:#d33; color:white; border:none; padding:10px;">LOGOUT</button>
                </div>
            </div>
        </div>

        <div class="dashboard-wrapper">
            <div class="glass-panel">
                <div style="display:flex; justify-content:space-between;">
                    <h2 id="dashTitle" style="margin:0; color:white;">SUBJECT</h2>
                    <button onclick="closeDash()" style="background:none; border:1px solid #555; color:white;">X</button>
                </div>
                <hr style="border-color:#333">
                <div id="chapterList" style="overflow-y:auto; flex:1;"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        Developed by <span class="highlight">Masrur Muntasir</span> | BSc. in CSE, DIU
    </div>

    <script>
        // ==========================================
        // 1. YOUR FIREBASE CONFIG HERE
        // ==========================================
      const firebaseConfig = {
  apiKey: "AIzaSyC3vbUgm1kXdzDjrWxW4o6HHBDlpL8mJyQ",
  authDomain: "masrur-app-dccc1.firebaseapp.com",
  databaseURL: "https://masrur-app-dccc1-default-rtdb.firebaseio.com",
  projectId: "masrur-app-dccc1",
  storageBucket: "masrur-app-dccc1.firebasestorage.app",
  messagingSenderId: "54049170636",
  appId: "1:54049170636:web:0d0fd5f530027e72688e69",
  measurementId: "G-0R3B6EB17B"
};
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Elements
        const authDiv = document.getElementById('auth-container');
        const stageDiv = document.getElementById('stage');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const book = document.getElementById('book');

        // --- AUTH FUNCTIONS ---
        function toggleForms() {
            loginForm.classList.toggle('hidden');
            signupForm.classList.toggle('hidden');
        }

        function handleLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }

        function handleSignup() {
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-password').value;
            const name = document.getElementById('signup-name').value;
            
            auth.createUserWithEmailAndPassword(email, pass).then(cred => {
                cred.user.updateProfile({ displayName: name });
                alert("Account Created!");
            }).catch(e => alert(e.message));
        }

        function logout() {
            auth.signOut();
            closeDash();
            book.classList.remove('open');
        }

        // Auth Listener
        auth.onAuthStateChanged(user => {
            if (user) {
                authDiv.classList.add('hidden');
                stageDiv.classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName;
                loadData(user.uid);
            } else {
                authDiv.classList.remove('hidden');
                stageDiv.classList.add('hidden');
            }
        });

        // --- APP FUNCTIONS ---
        function toggleBook(el) {
            // Only open if clicking cover, not inside pages
            if (!event.target.closest('.pages')) {
                el.classList.add('open');
            }
        }

        const chapters = {
            physics: ["ভৌত রাশি ও পরিমাপ", "গতি", "বল", "কাজ, ক্ষমতা ও শক্তি", "পদার্থের অবস্থা ও চাপ", "বস্তুর উপর তাপের প্রভাব", "তরঙ্গ ও শব্দ", "আলোর প্রতিফলন", "আলোর প্রতিসরণ", "স্থির তড়িৎ", "চল তড়িৎ", "বিদ্যুতের চৌম্বক ক্রিয়া", "আধুনিক পদার্থবিজ্ঞান", "জীবন বাঁচাতে পদার্থবিজ্ঞান"],
            chemistry: ["রসায়নের ধারণা", "পদার্থের অবস্থা", "পদার্থের গঠন", "পর্যায় সারণি", "রাসায়নিক বন্ধন", "মোলের ধারণা ও রাসায়নিক গণনা", "রাসায়নিক বিক্রিয়া", "রসায়ন ও শক্তি", "এসিড-ক্ষার সমতা", "খনিজ সম্পদ: ধাতু-অধাতু", "খনিজ সম্পদ: জীবাশ্ম", "আমাদের জীবনে রসায়ন"],
            biology: ["জীবন পাঠ", "জীবকোষ ও টিস্যু", "কোষ বিভাজন", "জীবনীশক্তি", "খাদ্য, পুষ্টি ও পরিপাক", "জীবে পরিবহন", "গ্যাসীয় বিনিময়", "রেচন প্রক্রিয়া", "দৃঢ়তা প্রদান ও চলন", "সমন্বয় ও নিঃসরণ", "জীবের প্রজনন", "জীবের বংশগতি ও বিবর্তন", "জীবের পরিবেশ", "জীবপ্রযুক্তি"],
            higherMath: ["সেট ও ফাংশন", "বীজগাণিতিক রাশি", "জ্যামিতি", "জ্যামিতিক অংকন", "সমীকরণ", "অসমতা", "অসীম ধারা", "ত্রিকোণমিতি", "সূচকীয় ও লগারিদমীয় ফাংশন", "দ্বিপদী বিস্তৃতি", "স্থানাঙ্ক জ্যামিতি", "সমতলীয় ভেক্টর", "ঘন জ্যামিতি", "সম্ভাবনা"]
        };

        let currentData = {};
        let activeSub = null;

        function loadData(uid) {
            db.ref('progress/' + uid).on('value', snap => {
                currentData = snap.val() || {};
                if(activeSub) openSubject(activeSub);
            });
        }

        function openSubject(sub) {
            activeSub = sub;
            stageDiv.classList.add('active');
            document.getElementById('dashTitle').innerText = sub.toUpperCase();
            
            const list = document.getElementById('chapterList');
            list.innerHTML = '';
            const subData = currentData[sub] || [];

            chapters[sub].forEach((chap, idx) => {
                const isDone = subData[idx] === true;
                const div = document.createElement('div');
                div.style.padding = "10px";
                div.style.borderBottom = "1px solid #333";
                div.style.cursor = "pointer";
                div.style.color = isDone ? "#0f0" : "#fff";
                div.innerHTML = `<span>${idx+1}. ${chap}</span> ${isDone ? '✔' : ''}`;
                div.onclick = () => {
                    const uid = auth.currentUser.uid;
                    db.ref(`progress/${uid}/${sub}/${idx}`).set(!isDone);
                };
                list.appendChild(div);
            });
        }

        function closeDash() {
            stageDiv.classList.remove('active');
            activeSub = null;
        }
    </script>
</body>
</html>
