<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SSC-26 Study Platform</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase v9 COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
    .glass { backdrop-filter: blur(12px); background: rgba(255,255,255,0.08); }
    .active { background:#22c55e !important; color:#000 !important; }
  </style>
</head>

<body class="bg-slate-900 text-white min-h-screen">

<div id="app" class="hidden">

  <!-- Desktop Sidebar -->
  <aside class="hidden md:flex fixed left-0 top-0 h-full w-56 bg-slate-950 p-4 flex-col gap-2">
    <h1 class="text-xl font-bold text-green-400">SSC-26</h1>
    <button onclick="nav('home')" class="navBtn">Home</button>
    <button onclick="nav('study')" class="navBtn">Study</button>
    <button onclick="nav('leaderboard')" class="navBtn">Leaderboard</button>
    <button onclick="nav('chat')" class="navBtn">Chat</button>
    <button onclick="nav('profile')" class="navBtn">Profile</button>
  </aside>

  <!-- Mobile Bottom Nav -->
  <nav class="md:hidden fixed bottom-0 w-full bg-slate-950 flex justify-around py-2">
    <button onclick="nav('home')">Home</button>
    <button onclick="nav('study')">Study</button>
    <button onclick="nav('leaderboard')">Rank</button>
    <button onclick="nav('chat')">Chat</button>
    <button onclick="nav('profile')">Me</button>
  </nav>

  <!-- Main Content -->
  <main class="md:ml-56 pb-20 p-4">

    <!-- HOME -->
    <section id="home" class="page">
      <div class="glass rounded-xl p-4 space-y-2">
        <h2 id="greet" class="text-xl font-bold"></h2>
        <p id="school"></p>
        <p>Online: <span id="onlineCount">0</span></p>
        <p>মোট পড়াশোনা সময়: <span id="totalTime">0</span> মিনিট</p>
        <p>XP: <span id="xp">0</span></p>
        <p>Rank: <span id="rank">-</span></p>
        <div class="mt-2">
          <p class="font-semibold">নোটিস:</p>
          <p id="notice">লোড হচ্ছে...</p>
        </div>
      </div>
    </section>

    <!-- STUDY -->
    <section id="study" class="page hidden space-y-4">
      <select id="subject" class="w-full p-2 text-black rounded">
        <option>Physics</option>
        <option>Chemistry</option>
        <option>Biology</option>
        <option>Math</option>
      </select>
      <select id="chapter" class="w-full p-2 text-black rounded">
        <option>ক</option><option>খ</option><option>গ</option><option>ঘ</option><option>MCQ</option>
      </select>
      <div class="text-center text-4xl" id="timer">00:00</div>
      <div class="flex gap-2 justify-center">
        <button onclick="startTimer()" class="bg-green-500 px-4 py-2 rounded">Start</button>
        <button onclick="pauseTimer()" class="bg-yellow-500 px-4 py-2 rounded">Pause</button>
        <button onclick="resetTimer()" class="bg-red-500 px-4 py-2 rounded">Reset</button>
      </div>
    </section>

    <!-- LEADERBOARD -->
    <section id="leaderboard" class="page hidden space-y-2"></section>

    <!-- CHAT -->
    <section id="chat" class="page hidden flex flex-col h-[70vh]">
      <div id="messages" class="flex-1 overflow-y-auto space-y-2"></div>
      <div class="flex gap-2">
        <input id="msgInput" class="flex-1 text-black p-2 rounded" placeholder="বার্তা লিখুন"/>
        <input type="file" id="imgInput" />
        <button onclick="sendMsg()" class="bg-green-500 px-4 rounded">Send</button>
      </div>
    </section>

    <!-- PROFILE -->
    <section id="profile" class="page hidden glass p-4 space-y-2">
      <p id="pName"></p>
      <p id="pSchool"></p>
      <p id="pTime"></p>
      <p id="pStatus"></p>
    </section>

    <!-- ADMIN -->
    <section id="admin" class="page hidden glass p-4 space-y-2">
      <h2 class="font-bold text-lg">Admin Panel</h2>
      <input id="adminNotice" class="text-black p-2 w-full rounded" placeholder="নোটিস লিখুন"/>
      <button onclick="postNotice()" class="bg-green-500 px-4 py-2 rounded">Post Notice</button>
      <button onclick="clearChat()" class="bg-red-500 px-4 py-2 rounded">Clear Chat</button>
    </section>

  </main>
</div>

<!-- AUTH -->
<div id="auth" class="min-h-screen flex items-center justify-center">
  <div class="glass p-6 rounded-xl w-full max-w-sm space-y-2">
    <h2 class="text-xl font-bold text-center">SSC-26 Login</h2>
    <input id="name" placeholder="Full Name" class="w-full p-2 text-black rounded"/>
    <input id="schoolInput" placeholder="School Name" class="w-full p-2 text-black rounded"/>
    <input id="email" placeholder="Email" class="w-full p-2 text-black rounded"/>
    <input id="pass" type="password" placeholder="Password" class="w-full p-2 text-black rounded"/>
    <button onclick="register()" class="w-full bg-green-500 py-2 rounded">Register</button>
    <button onclick="login()" class="w-full bg-blue-500 py-2 rounded">Login</button>
  </div>
</div>

<script>
/* Firebase Init */
const firebaseConfig = {
  apiKey: "AIzaSyC3vbUgm1kXdzDjrWxW4o6HHBDlpL8mJyQ",
  authDomain: "masrur-app-dccc1.firebaseapp.com",
  databaseURL: "https://masrur-app-dccc1-default-rtdb.firebaseio.com",
  projectId: "masrur-app-dccc1",
  storageBucket: "masrur-app-dccc1.firebasestorage.app",
  messagingSenderId: "54049170636",
  appId: "1:54049170636:web:0d0fd5f530027e72688e69"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();

let user, timerInt, seconds=0;

/* AUTH */
function register(){
  auth.createUserWithEmailAndPassword(email.value, pass.value).then(res=>{
    user=res.user;
    db.ref('users/'+user.uid).set({
      name:name.value, school:schoolInput.value,
      time:0, xp:0, online:true, last:Date.now()
    });
  });
}
function login(){
  auth.signInWithEmailAndPassword(email.value, pass.value);
}
auth.onAuthStateChanged(u=>{
  if(u){
    user=u;
    authDiv(false);
    initUser();
  }
});

/* UI */
function authDiv(show){
  auth.style.display=show?'flex':'none';
  app.style.display=show?'none':'block';
}
function nav(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

/* USER INIT */
function initUser(){
  const ref=db.ref('users/'+user.uid);
  ref.on('value',s=>{
    const d=s.val();
    greet.innerText='Hi, '+d.name.split(' ')[0];
    school.innerText=d.school;
    totalTime.innerText=d.time;
    xp.innerText=d.xp;
    pName.innerText=d.name;
    pSchool.innerText=d.school;
    pTime.innerText='মোট সময়: '+d.time;
    pStatus.innerText=d.online?'Online':'Offline';
  });
  db.ref('presence/'+user.uid).onDisconnect().set({online:false,last:Date.now()});
  db.ref('presence/'+user.uid).set({online:true,last:Date.now()});
}

/* TIMER */
function startTimer(){
  if(timerInt) return;
  timerInt=setInterval(()=>{
    seconds++;
    timer.innerText=new Date(seconds*1000).toISOString().substr(14,5);
  },1000);
}
function pauseTimer(){
  clearInterval(timerInt); timerInt=null;
}
function resetTimer(){
  pauseTimer();
  db.ref('users/'+user.uid+'/time').transaction(t=>(t||0)+Math.floor(seconds/60));
  db.ref('users/'+user.uid+'/xp').transaction(x=>(x||0)+Math.floor(seconds/60));
  seconds=0; timer.innerText='00:00';
}

/* LEADERBOARD */
db.ref('users').on('value',s=>{
  leaderboard.innerHTML='';
  const arr=Object.entries(s.val()||{}).sort((a,b)=>b[1].time-a[1].time);
  arr.forEach((u,i)=>{
    const d=u[1];
    leaderboard.innerHTML+=`<div class="glass p-2">${i+1}. ${d.name} - ${d.time}m</div>`;
    if(u[0]==user.uid) rank.innerText=i+1;
  });
});

/* CHAT */
function sendMsg(){
  if(imgInput.files[0]){
    const ref=storage.ref('chat/'+Date.now());
    ref.put(imgInput.files[0]).then(r=>r.ref.getDownloadURL().then(url=>{
      db.ref('chat').push({uid:user.uid,img:url});
    }));
  }else{
    db.ref('chat').push({uid:user.uid,text:msgInput.value});
  }
  msgInput.value='';
}
db.ref('chat').limitToLast(50).on('child_added',s=>{
  const m=s.val();
  messages.innerHTML+=`<div class="glass p-2">${m.text||'<img src="'+m.img+'" class="max-w-xs"/>'}</div>`;
});

/* ADMIN */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='a'){
    const p=prompt('Admin password');
    if(p==='admin123') nav('admin');
  }
});
function postNotice(){
  db.ref('notice').set(adminNotice.value);
}
db.ref('notice').on('value',s=>notice.innerText=s.val()||'');
function clearChat(){
  db.ref('chat').remove();
  messages.innerHTML='';
}

/* ONLINE COUNT */
db.ref('presence').on('value',s=>{
  let c=0; s.forEach(x=>x.val().online&&c++);
  onlineCount.innerText=c;
});
</script>
</body>
</html>
