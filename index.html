<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PC Master | Ultimate Fixed</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Outfit', sans-serif; background: #0b0e14; color: #e2e8f0; height: 100dvh; overflow: hidden; }
        .card { background: #151b28; border: 1px solid #2d3748; border-radius: 20px; transition: transform 0.2s; }
        .card:active { transform: scale(0.98); }
        .nav-item { color: #94a3b8; transition: all 0.3s; border-radius: 12px; }
        .nav-active { background: #3b82f6; color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .msg-me { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 16px 16px 0 16px; }
        .msg-other { background: #1e293b; border-radius: 16px 16px 16px 0; }
        #loader { position: fixed; inset: 0; background: #0b0e14; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-full">

    <div id="loader"><div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div></div>

    <div id="auth-screen" class="fixed inset-0 z-[100] bg-[#0b0e14] flex flex-col items-center justify-center p-6 hidden">
        <div class="card w-full max-w-sm p-8 shadow-2xl">
            <h1 class="text-3xl font-bold mb-2 text-center text-blue-500">PC Master</h1>
            <p class="text-slate-400 text-center text-sm mb-8">Login to continue</p>
            <div id="reg-fields" class="hidden space-y-4 mb-4">
                <input type="text" id="reg-name" placeholder="Full Name" class="w-full bg-[#0b0e14] border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 text-white">
                <input type="text" id="reg-school" placeholder="School Name" class="w-full bg-[#0b0e14] border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 text-white">
            </div>
            <input type="email" id="email" placeholder="Email" class="w-full bg-[#0b0e14] border border-slate-700 rounded-xl p-3 mb-4 outline-none focus:border-blue-500 text-white">
            <input type="password" id="pass" placeholder="Password" class="w-full bg-[#0b0e14] border border-slate-700 rounded-xl p-3 mb-6 outline-none focus:border-blue-500 text-white">
            <button onclick="handleAuth()" id="auth-btn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold shadow-lg transition text-white">LOG IN</button>
            <div class="flex justify-between text-xs text-slate-400 mt-6">
                <span onclick="toggleAuth()" id="auth-toggle" class="cursor-pointer hover:text-white">Create Account</span>
                <span onclick="forgotPass()" class="cursor-pointer hover:text-red-400">Forgot Pass?</span>
            </div>
        </div>
    </div>

    <div id="admin-login-modal" class="hidden fixed inset-0 z-[150] bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="card w-full max-w-sm p-6 relative">
            <button onclick="document.getElementById('admin-login-modal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400"><i class="fas fa-times"></i></button>
            <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><i class="fas fa-lock text-red-500"></i> Admin Access</h2>
            <div class="space-y-3">
                <input id="adm-email-in" type="email" placeholder="admin@pcmaster.com" class="w-full bg-[#0b0e14] border border-slate-700 rounded-lg p-3 text-sm text-white">
                <input id="adm-pass-in" type="password" placeholder="Pass: PCMaster@2026" class="w-full bg-[#0b0e14] border border-slate-700 rounded-lg p-3 text-sm text-white">
                <button onclick="verifyAdmin()" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded-lg font-bold">Unlock Panel</button>
            </div>
        </div>
    </div>

    <div id="admin-panel-modal" class="hidden fixed inset-0 z-[140] bg-black/90 flex items-center justify-center p-4">
        <div class="card w-full max-w-lg p-6 h-[85vh] overflow-y-auto relative">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">Admin Dashboard</h2>
                <button onclick="document.getElementById('admin-panel-modal').classList.add('hidden')" class="text-slate-400"><i class="fas fa-times"></i></button>
            </div>

            <div class="flex gap-2 mb-4 border-b border-slate-700 pb-2">
                <button onclick="switchAdminTab('mgmt')" class="text-sm font-bold text-blue-400 px-3 py-1 bg-slate-800 rounded">Management</button>
                <button onclick="switchAdminTab('stats')" class="text-sm font-bold text-slate-400 hover:text-white px-3 py-1">Analytics</button>
            </div>

            <div id="adm-mgmt">
                <div class="bg-slate-800/50 p-4 rounded-xl mb-4 border border-slate-700">
                    <h3 class="text-xs font-bold text-blue-400 mb-2 uppercase">📢 Post Notice</h3>
                    <input id="adm-note-title" type="text" placeholder="Title" class="w-full bg-[#0b0e14] border border-slate-700 rounded p-2 text-sm mb-2 text-white">
                    <textarea id="adm-note-body" placeholder="Details..." class="w-full bg-[#0b0e14] border border-slate-700 rounded p-2 text-sm text-white"></textarea>
                    <button onclick="postNotice()" class="w-full mt-2 bg-blue-600 py-2 rounded text-xs font-bold">Publish</button>
                </div>

                <div class="bg-slate-800/50 p-4 rounded-xl mb-4 border border-slate-700">
                    <h3 class="text-xs font-bold text-green-400 mb-2 uppercase">🎬 Add Class</h3>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <select id="adm-sub" class="bg-[#0b0e14] border border-slate-700 rounded p-2 text-xs text-white">
                            <option>Physics</option><option>Chemistry</option><option>Biology</option><option>Math</option>
                        </select>
                        <input id="adm-chap" type="text" placeholder="Chapter" class="bg-[#0b0e14] border border-slate-700 rounded p-2 text-xs text-white">
                    </div>
                    <input id="adm-vid-title" type="text" placeholder="Video Title" class="w-full bg-[#0b0e14] border border-slate-700 rounded p-2 text-xs mb-2 text-white">
                    <input id="adm-vid-link" type="text" placeholder="YouTube Embed URL" class="w-full bg-[#0b0e14] border border-slate-700 rounded p-2 text-xs mb-2 text-white">
                    <button onclick="addClass()" class="w-full bg-green-600 py-2 rounded text-xs font-bold">Add to Library</button>
                </div>

                <button onclick="resetData()" class="w-full bg-red-500/10 border border-red-500/50 text-red-400 py-3 rounded-xl text-xs font-bold hover:bg-red-600 hover:text-white transition">⚠ RESET ALL DATA</button>
            </div>

            <div id="adm-stats" class="hidden">
                <div class="bg-slate-800 p-4 rounded-xl mb-4">
                    <canvas id="adminChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <aside class="hidden md:flex w-64 bg-[#151b28] border-r border-slate-800 flex-col z-20">
        <div class="p-6 text-2xl font-bold text-white">PC MASTER</div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <button onclick="nav('home')" id="d-home" class="nav-item nav-active w-full text-left px-4 py-3 flex items-center gap-3 font-medium"><i class="fas fa-home"></i> Dashboard</button>
            <button onclick="nav('study')" id="d-study" class="nav-item w-full text-left px-4 py-3 flex items-center gap-3 font-medium"><i class="fas fa-clock"></i> Timer</button>
            <button onclick="nav('classes')" id="d-classes" class="nav-item w-full text-left px-4 py-3 flex items-center gap-3 font-medium"><i class="fas fa-play-circle"></i> Classes</button>
            <button onclick="nav('leaderboard')" id="d-leaderboard" class="nav-item w-full text-left px-4 py-3 flex items-center gap-3 font-medium"><i class="fas fa-trophy"></i> Rankings</button>
            <button onclick="nav('chat')" id="d-chat" class="nav-item w-full text-left px-4 py-3 flex items-center gap-3 font-medium"><i class="fas fa-comments"></i> Chat</button>
            
            <button onclick="openAdmin()" class="nav-item w-full text-left px-4 py-3 flex items-center gap-3 font-medium text-red-400 hover:bg-red-500/10 mt-6 border border-red-500/20"><i class="fas fa-shield-alt"></i> Admin Panel</button>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button onclick="logout()" class="w-full py-2 text-slate-400 hover:text-white text-xs font-bold">Sign Out</button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto relative bg-[#0b0e14]">
        
        <header class="md:hidden sticky top-0 z-30 bg-[#151b28]/90 backdrop-blur-md px-5 py-4 flex justify-between items-center border-b border-slate-800">
            <div class="font-bold text-lg text-white">PC MASTER</div>
            <div class="flex gap-4">
                <button onclick="openAdmin()" class="text-red-400"><i class="fas fa-shield-alt text-lg"></i></button>
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs" id="mob-avatar">U</div>
            </div>
        </header>

        <div id="home" class="p-5 md:p-10 max-w-5xl mx-auto">
            <div class="mb-8">
                <h1 class="text-2xl md:text-3xl font-bold text-white mb-1">Dashboard</h1>
                <p class="text-slate-400 text-sm" id="u-name-display">Welcome back.</p>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="card p-5"><div class="text-slate-400 text-xs font-bold uppercase mb-2">My XP</div><div class="text-2xl font-bold text-blue-400" id="dash-xp">0</div></div>
                <div class="card p-5"><div class="text-slate-400 text-xs font-bold uppercase mb-2">Time</div><div class="text-2xl font-bold text-purple-400" id="dash-time">0m</div></div>
                <div class="card p-5"><div class="text-slate-400 text-xs font-bold uppercase mb-2">Rank</div><div class="text-2xl font-bold text-yellow-400" id="dash-rank"># -</div></div>
                <div class="card p-5 border-blue-500/30 border"><div class="text-slate-400 text-xs font-bold uppercase mb-2">Live</div><div class="text-2xl font-bold text-green-400 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> <span id="live-cnt">0</span></div></div>
            </div>
            <div class="card p-6 border-l-4 border-blue-600">
                <div class="flex justify-between items-center mb-2"><span class="text-xs font-bold text-blue-400 bg-blue-400/10 px-2 py-1 rounded">NOTICE</span></div>
                <h3 class="text-lg font-bold text-white mb-2" id="nt-title">Loading...</h3>
                <p class="text-sm text-slate-400" id="nt-body">Please wait...</p>
            </div>
        </div>

        <div id="study" class="hidden h-full flex flex-col items-center justify-center p-6">
            <div class="card w-full max-w-md p-10 text-center relative shadow-2xl bg-[#151b28]">
                <div class="flex justify-center gap-3 mb-10">
                    <button onclick="setTimer(25)" class="px-4 py-2 rounded-lg bg-slate-800 text-xs font-bold hover:bg-blue-600 transition border border-slate-700">25m</button>
                    <button onclick="setTimer(60)" class="px-4 py-2 rounded-lg bg-slate-800 text-xs font-bold hover:bg-blue-600 transition border border-slate-700">1h</button>
                    <button onclick="setTimer(0.1)" class="px-4 py-2 rounded-lg bg-slate-800 text-xs font-bold text-green-400 border border-green-500/30">Test</button>
                </div>
                <div class="relative mb-10">
                    <div class="w-64 h-64 rounded-full border-8 border-slate-800 flex items-center justify-center mx-auto relative">
                        <div class="absolute inset-0 rounded-full border-8 border-blue-500 border-t-transparent animate-spin duration-[3s]" id="loading-ring" style="animation-play-state: paused;"></div>
                        <div class="text-center">
                            <div id="timer-display" class="text-6xl font-bold text-white tabular-nums tracking-tighter">25:00</div>
                            <div id="timer-status" class="text-xs font-bold text-blue-500 mt-2 uppercase tracking-widest">FOCUS</div>
                        </div>
                    </div>
                </div>
                <div class="flex justify-center gap-8 items-center">
                    <button onclick="toggleTimer()" id="play-btn" class="w-16 h-16 rounded-full bg-blue-600 text-white text-2xl flex items-center justify-center shadow-lg hover:scale-105 transition"><i class="fas fa-play ml-1"></i></button>
                </div>
            </div>
        </div>

        <div id="classes" class="hidden p-5 md:p-10 max-w-5xl mx-auto">
            <h2 class="text-2xl font-bold mb-6">Classes</h2>
            <div class="flex gap-3 overflow-x-auto pb-4 mb-2">
                <button onclick="loadClasses('Physics')" class="bg-blue-600 text-white px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap">Physics</button>
                <button onclick="loadClasses('Chemistry')" class="bg-slate-800 text-slate-300 px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap border border-slate-700">Chemistry</button>
                <button onclick="loadClasses('Biology')" class="bg-slate-800 text-slate-300 px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap border border-slate-700">Biology</button>
                <button onclick="loadClasses('Math')" class="bg-slate-800 text-slate-300 px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap border border-slate-700">Math</button>
            </div>
            <div id="class-container" class="space-y-4 pb-20"></div>
        </div>

        <div id="leaderboard" class="hidden p-5 md:p-10 max-w-3xl mx-auto">
            <h2 class="text-2xl font-bold mb-6">Top Learners</h2>
            <div id="rank-list" class="space-y-3 pb-20"></div>
        </div>

        <div id="chat" class="hidden h-full flex flex-col relative max-w-4xl mx-auto bg-[#0b0e14] md:border-x md:border-slate-800">
            <div class="p-4 bg-[#151b28] border-b border-slate-800 sticky top-0 z-10 font-bold flex justify-between">
                <span>Discussion</span>
                <span class="text-xs text-green-400 flex items-center gap-1"><span class="w-2 h-2 bg-green-500 rounded-full"></span> Live</span>
            </div>
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 pb-4"></div>
            <div class="p-3 bg-[#151b28] border-t border-slate-800">
                <div class="flex gap-2 items-center bg-[#0b0e14] p-2 rounded-full border border-slate-700">
                    <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 bg-transparent border-none text-sm focus:ring-0 outline-none text-white px-2">
                    <button onclick="sendMsg()" class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg"><i class="fas fa-paper-plane text-xs"></i></button>
                </div>
            </div>
        </div>

    </main>

    <nav class="md:hidden fixed bottom-0 w-full bg-[#151b28] border-t border-slate-800 z-40 flex justify-around py-3 pb-[env(safe-area-inset-bottom)]">
        <button onclick="nav('home')" id="m-home" class="text-blue-500 flex flex-col items-center"><i class="fas fa-home text-xl mb-1"></i></button>
        <button onclick="nav('study')" id="m-study" class="text-slate-500 flex flex-col items-center"><i class="fas fa-clock text-xl mb-1"></i></button>
        <button onclick="nav('classes')" class="text-white flex flex-col items-center -mt-8"><div class="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center shadow-lg border-4 border-[#0b0e14]"><i class="fas fa-play"></i></div></button>
        <button onclick="nav('leaderboard')" id="m-leaderboard" class="text-slate-500 flex flex-col items-center"><i class="fas fa-trophy text-xl mb-1"></i></button>
        <button onclick="nav('chat')" id="m-chat" class="text-slate-500 flex flex-col items-center"><i class="fas fa-comments text-xl mb-1"></i></button>
    </nav>

    <audio id="audio-alarm" src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3"></audio>

    <script>
        // FIREBASE CONFIG (REPLACE WITH YOUR KEYS)
        const firebaseConfig = { apiKey: "AIzaSyC3vbUgm1kXdzDjrWxW4o6HHBDlpL8mJyQ", authDomain: "masrur-app-dccc1.firebaseapp.com", databaseURL: "https://masrur-app-dccc1-default-rtdb.firebaseio.com", projectId: "masrur-app-dccc1", storageBucket: "masrur-app-dccc1.firebasestorage.app", messagingSenderId: "54049170636", appId: "1:54049170636:web:0d0fd5f530027e72688e69" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.database();
        let user = null;

        // AUTH
        let isReg = false;
        function toggleAuth() { isReg=!isReg; document.getElementById('reg-fields').classList.toggle('hidden'); document.getElementById('auth-btn').innerText = isReg ? 'REGISTER' : 'LOGIN'; }
        
        async function handleAuth() {
            const em=document.getElementById('email').value, pw=document.getElementById('pass').value;
            try {
                await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                if(isReg) {
                    const nm=document.getElementById('reg-name').value, sc=document.getElementById('reg-school').value;
                    if(!nm||!sc) throw new Error("Fill fields");
                    const c = await auth.createUserWithEmailAndPassword(em,pw);
                    await c.user.updateProfile({displayName:nm});
                    await db.ref('users/'+c.user.uid).set({name:nm, school:sc, email:em});
                } else { await auth.signInWithEmailAndPassword(em,pw); }
            } catch(e) { Swal.fire({icon:'error', title:'Error', text:e.message, background:'#151b28', color:'#fff'}); }
        }
        function forgotPass() { Swal.fire({title:'Reset Pass', input:'email', background:'#151b28', color:'#fff'}).then(r=>{if(r.value) auth.sendPasswordResetEmail(r.value)}); }

        auth.onAuthStateChanged(u => {
            document.getElementById('loader').style.display='none';
            if(u) {
                user=u; document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('u-name-display').innerText = `Welcome, ${u.displayName}`;
                document.getElementById('mob-avatar').innerText = (u.displayName||'U')[0];
                initApp();
            } else { document.getElementById('auth-screen').classList.remove('hidden'); }
        });
        function logout() { auth.signOut().then(()=>location.reload()); }

        // APP CORE
        function initApp() { presence(); loadRank(); loadClasses('Physics'); loadNotice(); loadStats(); loadChat(); initChart(); }

        // ADMIN
        function openAdmin() { document.getElementById('admin-login-modal').classList.remove('hidden'); }
        function verifyAdmin() {
            const e = document.getElementById('adm-email-in').value, p = document.getElementById('adm-pass-in').value;
            if(e==='admin@pcmaster.com' && p==='PCMaster@2026') {
                document.getElementById('admin-login-modal').classList.add('hidden');
                document.getElementById('admin-panel-modal').classList.remove('hidden');
            } else { Swal.fire('Error','Invalid','error'); }
        }
        function switchAdminTab(t) { document.getElementById('adm-mgmt').style.display=t==='mgmt'?'block':'none'; document.getElementById('adm-stats').style.display=t==='stats'?'block':'none'; }
        
        function postNotice() { const t=document.getElementById('adm-note-title').value, b=document.getElementById('adm-note-body').value; if(t) db.ref('notice').set({title:t, body:b}).then(()=>Swal.fire('Posted','','success')); }
        function loadNotice() { db.ref('notice').on('value', s=>{ const d=s.val(); if(d){document.getElementById('nt-title').innerText=d.title; document.getElementById('nt-body').innerText=d.body;} }); }

        function addClass() {
            const s=document.getElementById('adm-sub').value, c=document.getElementById('adm-chap').value, t=document.getElementById('adm-vid-title').value, l=document.getElementById('adm-vid-link').value;
            if(s&&t&&l) { db.ref('classes').push({subject:s, chapter:c, title:t, link:l}); Swal.fire('Added','','success'); }
        }
        function resetData() { if(confirm('RESET ALL DATA?')) { db.ref('messages').remove(); db.ref('progress').remove(); db.ref('classes').remove(); } }
        function initChart() { new Chart(document.getElementById('adminChart'), { type: 'bar', data: { labels: ['Phy', 'Chem', 'Bio', 'Math'], datasets: [{ data: [12, 19, 3, 5], backgroundColor: '#3b82f6' }] }, options: { scales: { y: { grid: { color:'#334155' } } } } }); }

        // TIMER
        let tmr, time=1500, run=false, dur=25;
        function setTimer(m) { clearInterval(tmr); run=false; dur=m; time=m*60; updT(); document.getElementById('play-btn').innerHTML='<i class="fas fa-play ml-1"></i>'; document.getElementById('loading-ring').style.animationPlayState = 'paused'; }
        function toggleTimer() {
            if(run) { clearInterval(tmr); run=false; document.getElementById('play-btn').innerHTML='<i class="fas fa-play ml-1"></i>'; document.getElementById('loading-ring').style.animationPlayState = 'paused'; }
            else {
                run=true; document.getElementById('play-btn').innerHTML='<i class="fas fa-pause"></i>'; document.getElementById('loading-ring').style.animationPlayState = 'running';
                tmr=setInterval(()=>{
                    if(time>0) { time--; updT(); } else { 
                        clearInterval(tmr); run=false; document.getElementById('audio-alarm').play(); 
                        db.ref(`progress/${user.uid}/${Date.now()}`).set({xp:50, time:dur}); 
                        Swal.fire({title:'Time Up!', text:'+50 XP', icon:'success'}); setTimer(25);
                    }
                }, 1000);
            }
        }
        function updT() { const m=Math.floor(time/60), s=Math.floor(time%60); document.getElementById('timer-display').innerText=`${m}:${s<10?'0'+s:s}`; }

        // DATA LOADING
        function loadStats() { db.ref('progress/'+user.uid).on('value', s=>{ let xp=0,m=0; Object.values(s.val()||{}).forEach(x=>{if(x.xp)xp+=x.xp;if(x.time)m+=x.time;}); document.getElementById('dash-xp').innerText=xp; document.getElementById('dash-time').innerText=Math.floor(m/60)+'h'; }); }
        
        function loadChat() {
            const b = document.getElementById('chat-box'); b.innerHTML = '';
            db.ref('messages').limitToLast(30).on('child_added', s => {
                const m = s.val(), me = m.uid===user.uid;
                const d = document.createElement('div');
                d.className = `p-3 text-sm max-w-[85%] rounded-xl mb-2 ${me?'msg-me self-end text-white':'msg-other self-start text-slate-300'}`;
                if(!me) d.innerHTML = `<div class="text-[10px] text-blue-400 font-bold mb-1">${m.name}</div>${m.text}`;
                else d.innerHTML = m.text;
                if(me) d.style.alignSelf = 'flex-end';
                b.appendChild(d); b.scrollTop = b.scrollHeight;
            });
        }
        function sendMsg() { const i=document.getElementById('chat-input'); if(i.value.trim()){ db.ref('messages').push({text:i.value, uid:user.uid, name:user.displayName, time:Date.now()}); i.value=''; } }

        function loadRank() {
            db.ref('users').once('value', uS => {
                db.ref('progress').once('value', pS => {
                    const us=uS.val()||{}, pr=pS.val()||{}, list=[];
                    Object.keys(us).forEach(id=>{
                        let xp=0; if(pr[id]) Object.values(pr[id]).forEach(x=>{if(x.xp)xp+=x.xp});
                        list.push({n:us[id].name, s:us[id].school, xp, id});
                    });
                    list.sort((a,b)=>b.xp-a.xp);
                    const myRank = list.findIndex(x=>x.id===user.uid) + 1;
                    document.getElementById('dash-rank').innerText = "# " + (myRank>0?myRank:'-');
                    document.getElementById('rank-list').innerHTML = list.map((d,i) => `
                        <div class="card p-3 flex items-center justify-between mb-2 ${d.id===user.uid?'border-l-4 border-blue-500 bg-blue-500/10':''}">
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-slate-500 w-5">#${i+1}</span>
                                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white">${(d.n||'U')[0]}</div>
                                <div><div class="font-bold text-sm text-white">${d.n}</div><div class="text-[10px] text-slate-500">${d.s}</div></div>
                            </div>
                            <div class="font-bold text-blue-400 text-sm">${d.xp} XP</div>
                        </div>
                    `).join('');
                });
            });
        }

        function loadClasses(sub) {
            db.ref('classes').on('value', s => {
                const c=document.getElementById('class-container'); c.innerHTML='';
                const all=Object.values(s.val()||{}).filter(x=>x.subject===sub);
                if(!all.length) { c.innerHTML='<div class="text-center text-slate-500">No classes</div>'; return; }
                const grp = all.reduce((a,i)=>{a[i.chapter]=a[i.chapter]||[];a[i.chapter].push(i);return a},{});
                Object.keys(grp).forEach(ch=>{
                    let h=`<div class="mb-4"><h3 class="text-sm font-bold text-slate-400 mb-2 border-b border-slate-800 pb-1">${ch}</h3><div class="grid gap-2">`;
                    grp[ch].forEach(v=>{ h+=`<div onclick="play('${v.link}')" class="card p-3 flex items-center gap-3 cursor-pointer hover:border-blue-500"><div class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center text-white text-xs"><i class="fas fa-play"></i></div><div><div class="font-bold text-sm text-white">${v.title}</div><div class="text-[10px] text-slate-500">Watch</div></div></div>`});
                    h+='</div></div>'; c.innerHTML+=h;
                });
            });
        }
        function play(l) { Swal.fire({html:`<iframe width="100%" height="250" src="${l}" frameborder="0" allowfullscreen></iframe>`, showConfirmButton:false, background:'#151b28', width:600}); }

        function presence() {
            const con = db.ref(".info/connected"), st = db.ref("/status/" + user.uid);
            con.on("value", s => { if(s.val()) st.onDisconnect().set({st:'offline'}).then(()=>st.set({st:'online'})); });
            db.ref('status').on('value', s => { let c=0; s.forEach(x => { if(x.val().st==='online') c++ }); document.getElementById('live-cnt').innerText=c; });
        }

        function nav(p) {
            ['home','study','classes','leaderboard','chat'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById('d-'+id)?.classList.remove('nav-active', 'text-blue-500');
                document.getElementById('m-'+id)?.classList.remove('text-blue-500');
            });
            document.getElementById(p).classList.remove('hidden');
            document.getElementById('d-'+p)?.classList.add('nav-active', 'text-blue-500');
            document.getElementById('m-'+p)?.classList.add('text-blue-500');
        }
    </script>
</body>
</html>
